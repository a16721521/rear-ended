<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAW DOG</title>
<style>
body{
    margin:0;
    background:#0b0b0c;
    color:white;
    font-family:Inter,Arial,sans-serif;
}
.hero{
    min-height:100vh;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:4rem;
    padding:4rem 6vw;
}
h1{
    font-size:clamp(4rem,9vw,8rem);
    line-height:.9;
    margin:0;
}
p{
    color:#b0b0b0;
    font-size:1.2rem;
    max-width:500px;
}
.cta{
    display:inline-block;
    margin-top:2rem;
    background:white;
    color:black;
    padding:16px 24px;
    text-decoration:none;
    font-weight:bold;
    border-radius:10px;
}
.hero-image{
    width:100%;
    height:80vh;
    object-fit:cover;
    border-radius:24px;
}
@media(max-width:900px){
    .hero{grid-template-columns:1fr;}
    .hero-image{height:50vh;}
}
</style>
</head>
<body>
<section class="hero">
  <div>
    <div style="letter-spacing:.2em;color:#888;">CALIFORNIA PERSONAL INJURY</div>
    <h1>YOU GOT HIT.<br>WE GOT THIS.</h1>
    <p>Modern California personal injury attorneys. No fees unless we win.</p>
    <a class="cta" href="#">Start Your Case</a>
  </div>
  <div>
    <img class="hero-image" src="lawdog-hero.jpg" alt="Law Dog Hero">
  </div>
</section>
</body>
</html>
